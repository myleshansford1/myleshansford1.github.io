<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myles Hansford | Business Marketing & Brand Strategy Portfolio</title>
  
  <!-- Google Fonts: Inter for clean, modern readability -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================================================
       1. GLOBAL STYLES & CSS VARIABLES
       ========================================================================== */
    :root {
      /* Engineering & Professional Color Palette */
      --primary-navy: #0A192F;      /* Deep background & high-contrast headers */
      --accent-blue: #0066CC;       /* Primary interactive buttons & key accents */
      --accent-teal: #00B4D8;       /* Secondary highlights & hover states */
      --bg-main: #F8FAFC;           /* Off-white light background for high contrast */
      --bg-card: #FFFFFF;           /* Pure white card backgrounds */
      --text-main: #1E293B;         /* Dark slate for optimal body readability */
      --text-muted: #64748B;        /* Slate gray for secondary details */
      --border-color: #E2E8F0;      /* Subtle divider lines */
      
      /* Layout Constants */
      --max-width: 1100px;
      --transition-speed: 0.3s;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    /* Reset & Base Formatting */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth; /* Smooth scrolling across navigation links */
      font-size: 16px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: color var(--transition-speed) ease;
    }

    ul {
      list-style: none;
    }

    .container {
      width: 90%;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    section {
      padding: 5rem 0;
    }

    .section-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-navy);
      margin-bottom: 0.5rem;
      position: relative;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 3rem;
      font-weight: 400;
    }

    .section-title::after {
      content: '';
      display: block;
      width: 50px;
      height: 4px;
      background: var(--accent-blue);
      margin-top: 0.5rem;
      border-radius: 2px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all var(--transition-speed) ease;
      border: 2px solid transparent;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: #0052A3;
      transform: translateY(-2px);
    }

    .btn-outline {
      border-color: var(--primary-navy);
      color: var(--primary-navy);
      background: transparent;
    }

    .btn-outline:hover {
      background-color: var(--primary-navy);
      color: #FFFFFF;
      transform: translateY(-2px);
    }

    /* Tag Badges */
    .tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background-color: #E0F2FE;
      color: var(--accent-blue);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* ==========================================================================
       2. HEADER & NAVIGATION
       ========================================================================== */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      transition: all var(--transition-speed) ease;
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-navy);
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--accent-blue);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .nav-links a:hover {
      color: var(--accent-blue);
    }

    /* Mobile Menu Toggle Button */
    .menu-toggle {
      display: none;
      font-size: 1.5rem;
      color: var(--primary-navy);
      cursor: pointer;
    }

    /* ==========================================================================
       3. HERO SECTION
       ========================================================================== */
    .hero {
      padding-top: 9rem;
      padding-bottom: 5rem;
      background: linear-gradient(135deg, #FFFFFF 0%, #F1F5F9 100%);
      border-bottom: 1px solid var(--border-color);
    }

    .hero-content {
      max-width: 800px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #EFF6FF;
      color: var(--accent-blue);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border: 1px solid #BFDBFE;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary-navy);
      line-height: 1.2;
      margin-bottom: 1rem;
      letter-spacing: -1px;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      max-width: 700px;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* ==========================================================================
       4. ABOUT ME SECTION
       ========================================================================== */
    .about-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    .about-text p {
      margin-bottom: 1.25rem;
      color: var(--text-main);
      font-size: 1.05rem;
    }

    .about-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: var(--card-shadow);
    }

    .about-card h3 {
      font-size: 1.1rem;
      color: var(--primary-navy);
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--bg-main);
      padding-bottom: 0.5rem;
    }

    .info-list li {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .info-list .label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-list .value {
      color: var(--primary-navy);
      font-weight: 600;
      text-align: right;
    }

    /* ==========================================================================
       5. PROJECTS SECTION
       ========================================================================== */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: var(--card-shadow);
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--hover-shadow);
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .project-icon {
      font-size: 1.8rem;
      color: var(--accent-blue);
    }

    .project-card h3 {
      font-size: 1.25rem;
      color: var(--primary-navy);
      margin-bottom: 0.5rem;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .project-bullets {
      margin-bottom: 1.5rem;
    }

    .project-bullets li {
      position: relative;
      padding-left: 1.25rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .project-bullets li::before {
      content: "•";
      color: var(--accent-blue);
      font-weight: bold;
      position: absolute;
      left: 0;
    }

    .project-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* ==========================================================================
       6. SKILLS SECTION
       ========================================================================== */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .skill-category {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: var(--card-shadow);
    }

    .skill-category h3 {
      font-size: 1.1rem;
      color: var(--primary-navy);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .skill-category h3 i {
      color: var(--accent-blue);
    }

    .skill-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .skill-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .skill-level {
      font-size: 0.8rem;
      color: var(--text-muted);
      background-color: var(--bg-main);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }

    /* AI Highlight Banner */
    .ai-banner {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #0A192F 0%, #1E3A8A 100%);
      color: #FFFFFF;
      padding: 1.75rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: var(--hover-shadow);
    }

    .ai-banner-icon {
      font-size: 2.5rem;
      color: var(--accent-teal);
    }

    .ai-banner h3 {
      font-size: 1.2rem;
      margin-bottom: 0.25rem;
    }

    .ai-banner p {
      font-size: 0.95rem;
      color: #CBD5E1;
    }

    /* ==========================================================================
       7. CAREER GOALS & ATHLETICS SECTION
       ========================================================================== */
    .goals-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .goal-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-top: 4px solid var(--accent-blue);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: var(--card-shadow);
    }

    .goal-card h3 {
      font-size: 1.2rem;
      color: var(--primary-navy);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .goal-card p {
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    /* ==========================================================================
       8. CONTACT & FOOTER SECTION
       ========================================================================== */
    .contact-section {
      background-color: var(--primary-navy);
      color: #FFFFFF;
      padding: 5rem 0 2rem 0;
    }

    .contact-section .section-title {
      color: #FFFFFF;
    }

    .contact-section .section-subtitle {
      color: #94A3B8;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin-bottom: 4rem;
    }

    .contact-info p {
      color: #CBD5E1;
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .contact-details {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1rem;
      color: #E2E8F0;
    }

    .contact-item i {
      width: 40px;
      height: 40px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-teal);
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #1E293B;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-group input:focus,
